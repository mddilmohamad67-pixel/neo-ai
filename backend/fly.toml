app = "neo"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NEO_ENV = "production"
  NEO_HOST = "0.0.0.0"
  NEO_REQUIRE_HTTPS = "1"
  NEO_FORWARDED_IPS = "*"
  NEO_PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
